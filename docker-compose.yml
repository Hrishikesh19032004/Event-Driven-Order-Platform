services:
  redpanda:
    image: redpandadata/redpanda:latest
    command: >
      redpanda start --smp 1 --memory 512M --overprovisioned --node-id 0
      --kafka-addr PLAINTEXT://0.0.0.0:9092
      --advertise-kafka-addr PLAINTEXT://localhost:9092
      --set redpanda.auto_create_topics_enabled=true
    ports: ["9092:9092"]
  pg-order:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: orders }
    ports: ["5433:5432"]
  pg-inventory:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: inventory }
    ports: ["5434:5432"]
  pg-payment:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: payments }
    ports: ["5435:5432"]
  pg-notification:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: notifications }
    ports: ["5436:5432"]
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686", "4318:4318"]